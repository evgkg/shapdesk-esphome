substitutions:
  name: shapdesk
  # Проверьте соответствие K3–K6 физическим пресетам.
  k3_name: "Пресет 1"
  k4_name: "Пресет 2"
  k5_name: "Пресет 3"
  k6_name: "Пресет 4"
  max_hold_ms: "20000"
  pulse_ms: "300"
  start_timeout_ms: "3000"
  min_height: "66"
  max_height: "131"
  tolerance: "1"
  stop_offset: "1"
  adapt_offset: "true"

esphome:
  name: ${name}
  friendly_name: Shapdesk
  on_shutdown:
    priority: 800
    then:
      - lambda: id(desk).inhibit();

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf

external_components:
  - source:
      type: local
      path: components
    components: [shapdesk]

logger:
  hardware_uart: USB_SERIAL_JTAG
  level: INFO

api:
  encryption:
    key: !secret api_encryption_key
  on_client_disconnected:
    then:
      - lambda: id(desk).stop();
  actions:
    - action: press_key
      variables:
        key: int
        duration_ms: int
      then:
        - lambda: id(desk).press_key(key, duration_ms);

ota:
  - platform: esphome
    password: !secret ota_password
    on_begin:
      then:
        - lambda: id(desk).inhibit();

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  on_disconnect:
    then:
      - lambda: id(desk).stop();
  ap:
    ssid: Shapdesk Fallback
    password: !secret fallback_password

captive_portal:

# Компонент владеет UART1: GPIO4 RX, 9600 8N1, без TX.

shapdesk:
  id: desk
  name: "Стол"
  max_hold_ms: ${max_hold_ms}
  pulse_ms: ${pulse_ms}
  start_timeout_ms: ${start_timeout_ms}
  minimum: ${min_height}
  maximum: ${max_height}
  tolerance: ${tolerance}
  stop_offset: ${stop_offset}
  adapt: ${adapt_offset}
  height:
    name: "Высота стола"
  display:
    name: "Высота на дисплее"
  raw:
    name: Position raw
    disabled_by_default: true
  good:
    name: "Валидные пакеты"
  rejected:
    name: "Отвергнутые пакеты"
  moving:
    name: "Стол движется"
  link:
    name: "Связь с пультом"

sensor:
  - platform: wifi_signal
    name: Wi-Fi RSSI
    entity_category: diagnostic
    update_interval: 30s
  - platform: uptime
    name: Uptime
    entity_category: diagnostic

number:
  - platform: template
    name: "Целевая высота"
    min_value: ${min_height}
    max_value: ${max_height}
    step: 1
    unit_of_measurement: cm
    optimistic: false
    set_action:
      - lambda: |-
          if (id(desk).move_to(x)) id(target_height).publish_state(x);
    id: target_height

button:
  - platform: template
    name: ${k3_name}
    on_press:
      - lambda: id(desk).press_key(3, ${pulse_ms});
  - platform: template
    name: ${k4_name}
    on_press:
      - lambda: id(desk).press_key(4, ${pulse_ms});
  - platform: template
    name: ${k5_name}
    on_press:
      - lambda: id(desk).press_key(5, ${pulse_ms});
  - platform: template
    name: ${k6_name}
    on_press:
      - lambda: id(desk).press_key(6, ${pulse_ms});
  - platform: template
    name: M
    on_press:
      - lambda: id(desk).press_key(7, ${pulse_ms});
  - platform: template
    name: "Стоп"
    on_press:
      - lambda: id(desk).stop();
